async function ejecutarImportacion(){
  if(!importPreview.length) return;
  const btn = document.getElementById("imp-btn");
  const progWrap = document.getElementById("imp-progwrap");
  const prog = document.getElementById("imp-prog");
  const progText = document.getElementById("imp-progtext");
  const logDiv = document.getElementById("imp-log");
  
  btn.disabled=true; btn.textContent="Subiendo...";
  progWrap.style.display="block";
  logDiv.style.display="block";
  
  let ok=0, err=0, duplicados=0;
  for(let i=0; i<importPreview.length; i++){
    const e = importPreview[i];
    try{
      // Check for duplicate by cedula
      if(e.cedula){
        const existe = estudiantes.find(x=>x.cedula===e.cedula);
        if(existe){
          duplicados++;
          logDiv.innerHTML+=`<div style="color:#f6a623">⚠️ Duplicado: ${e.nombre} (ya existe)</div>`;
          logDiv.scrollTop=logDiv.scrollHeight;
          prog.style.width=`${Math.round((i+1)/importPreview.length*100)}%`;
          progText.textContent=`${i+1} de ${importPreview.length}`;
          continue;
        }
      }
      const ref = await db.collection("estudiantes").add({
        ...e, timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      e.id = ref.id;
      estudiantes.push(e);
      ok++;
      logDiv.innerHTML+=`<div style="color:#1a9e5c">✅ ${e.nombre}</div>`;
    }catch(ex){
      err++;
      logDiv.innerHTML+=`<div style="color:#e53e3e">❌ ${e.nombre}: ${ex.message}</div>`;
    }
    logDiv.scrollTop=logDiv.scrollHeight;
    prog.style.width=`${Math.round((i+1)/importPreview.length*100)}%`;
    progText.textContent=`${i+1} de ${importPreview.length}`;
    await new Promise(r=>setTimeout(r,120));
  }
  
  btn.textContent=`✅ Listo: ${ok} subidos · ${duplicados} duplicados · ${err} errores`;
  btn.style.background="linear-gradient(135deg,#1a9e5c,#16875a)";
  importPreview=[];
  logDiv.innerHTML+=`<div style="color:#003366;font-weight:700;margin-top:4px">🎉 Importación completada</div>`;
}

function autoFillMontoNomina(trabId){
  const t = trabajadores.find(w=>w.id===trabId);
  if(!t) return;
  const neto = (t.salario||0)+(t.bonoAlimentacion||0)+(t.bonoProductividad||0)-(t.descuento||0);
  const el = document.getElementById("pn-monto");
  if(el){ el.value = neto.toFixed(2).replace(".",","); fmtInput(el); }
  calcNetoNomina();
}

function calcNetoNomina(){
  const monto = parseFmt(document.getElementById("pn-monto")?.value||"0");
  const desc = parseFmt(document.getElementById("pn-descuento")?.value||"0");
  const otros = leerOtrosConceptos().lista.reduce((x,o)=>x+o.monto,0);
  const tasa = parseTasa(document.getElementById("pn-tasa")?.value||"0");
  const box = document.getElementById("pn-neto-box");
  if(!box) return;
  if(monto>0||otros>0){
    const neto=Math.max(0,r2(monto+otros-desc));
    box.style.display="block";
    document.getElementById("pn-neto-monto").textContent = fmt(monto);
    document.getElementById("pn-neto-otros-row").style.display = otros>0?"flex":"none";
    document.getElementById("pn-neto-otros").textContent = "+"+fmt(otros);
    document.getElementById("pn-neto-desc").textContent = desc>0?"-"+fmt(desc):fmt(0);
    document.getElementById("pn-neto-total").textContent = fmt(neto);
    const rb=document.getElementById("pn-neto-bs-row");
    rb.style.display = tasa>0?"flex":"none";
    document.getElementById("pn-neto-bs").textContent = tasa>0?fmtBs(r2(neto*tasa)):"";
  } else {
    box.style.display="none";
  }
}

const monedaFin=()=>{const b=document.getElementById("fin-m-usd");return b&&b.classList.contains("selected")?"USD":"VES";};
function selMonedaFin(m){
  const a=document.getElementById("fin-m-ves"),b=document.getElementById("fin-m-usd");
  if(a)a.classList.toggle("selected",m==="VES");if(b)b.classList.toggle("selected",m==="USD");
  const sy=document.getElementById("fin-simbolo");if(sy)sy.textContent=m==="USD"?"$":"Bs.";
  calcFin();
}
// Lo escrito en Bs. se convierte a $ de referencia; lo escrito en $ se convierte a Bs.: siempre se guardan los dos
function calcFinValores(){
  const mon=monedaFin(),v=parseFmt(document.getElementById("fin-monto")?document.getElementById("fin-monto").value:"0"),tasa=parseTasa(document.getElementById("fin-tasa")?document.getElementById("fin-tasa").value:"0");
  if(!v||!(tasa>0)) return {mon,v,tasa,usd:null,bs:null};
  return mon==="USD"?{mon,v,tasa,usd:r2(v),bs:r2(v*tasa)}:{mon,v,tasa,usd:r2(v/tasa),bs:r2(v)};
}
function calcFin(){
  const box=document.getElementById("fin-equiv");if(!box)return;
  const c=calcFinValores();
  if(c.usd!=null){box.style.display="block";box.innerHTML=c.mon==="VES"?`Equivale a <strong>${fmt(c.usd)}</strong> de referencia`:`Equivale a <strong>${fmtBs(c.bs)}</strong> a la tasa indicada`;}
  else box.style.display="none";
}

async function guardarFinanza(tipo){
  const desc=document.getElementById("fin-desc").value.trim();
  const fecha=document.getElementById("fin-fecha").value;
  const c=calcFinValores();
  const err=m=>{document.getElementById("fin-err").innerHTML=`<div class="error-msg">${m}</div>`;};
  if(!desc||!c.v||!fecha){err("Completa descripción, fecha y monto");return;}
  if(!(c.tasa>0)){err("Falta la tasa BCV: cárgala con 💱 (arriba) o escríbela en el formulario");return;}
  if(!(c.usd>0)){err("El monto es muy pequeño para la tasa indicada");return;}
  const datos={tipo,descripcion:desc,fecha,categoria:document.getElementById("fin-cat").value,
    monto:c.usd,montoBs:c.bs,tasa:c.tasa,moneda:c.mon,
    responsable:document.getElementById("fin-resp").value.trim(),
    observaciones:document.getElementById("fin-obs").value.trim(),
    timestamp:firebase.firestore.FieldValue.serverTimestamp()};
  try{
    const ref=await db.collection("finanzas").add(datos);datos.id=ref.id;finanzas.push(datos);
    recordarTasa(fecha,c.tasa);
    alertaFinanza(datos);cerrarModal();
  }catch(e){err(e.message);}
}

async function guardarPagoNomina(){
  const desc=document.getElementById("pn-desc").value.trim();
  const fecha=document.getElementById("pn-fecha").value;
  const trabId=document.getElementById("pn-trab").value;
  const descuento=parseFmt(document.getElementById("pn-descuento")?.value||"0");
  const monto=parseFmt(document.getElementById("pn-monto").value);
  const tasa=parseTasa(document.getElementById("pn-tasa")?document.getElementById("pn-tasa").value:"0");
  const err=m=>{document.getElementById("pn-err").innerHTML=`<div class="error-msg">${m}</div>`;};
  const {lista,error:errOtros}=leerOtrosConceptos();
  if(errOtros){err(errOtros);return;}
  const totalOtros=lista.reduce((x,o)=>x+o.monto,0);
  if(!desc||(!monto&&!totalOtros)){err("Completa descripción y monto");return;}
  if(!fecha){err("Elige la fecha del pago");return;}
  if(!(tasa>0)){err("Falta la tasa BCV: cárgala con 💱 (arriba) o escríbela en el formulario");return;}
  const neto=Math.max(0,r2(monto+totalOtros-descuento));
  if(neto<=0){err("El total a entregar debe ser mayor que 0");return;}
  const otros=lista.map(o=>({nombre:o.nombre,monto:o.monto,montoBs:r2(o.monto*tasa)}));
  const trab=trabajadores.find(t=>t.id===trabId)||null;
  const datos={tipo:"gasto",descripcion:desc,fecha,categoria:"Nómina",
    monto:neto,montoBs:r2(neto*tasa),tasa,montoBase:monto,descuento,otros,
    responsable:trab?trab.nombre:trabId,trabajadorId:trabId,
    timestamp:firebase.firestore.FieldValue.serverTimestamp()};
  try{
    const ref=await db.collection("finanzas").add(datos);datos.id=ref.id;finanzas.push(datos);
    recordarTasa(fecha,tasa);
    alertaPagoNomina(datos.descripcion,datos.monto,datos.responsable);
    cerrarModal();
    imprimirReciboNominaPago(datos,trab);
  }catch(e){err(e.message);}
}

// ==================== MONEDA: $ REFERENCIA + Bs. A TASA BCV ====================
// Todos los montos del sistema están en $ de referencia. Cada operación guarda además la tasa BCV usada
// y su valor real en bolívares, para que el flujo de caja pueda mostrarse en Bs. con la referencia en $.
let tasas={};   // {"YYYY-MM-DD": Bs. por $1}  (compartidas: config/tasasBCV)
const r2=n=>Math.round((Number(n)||0)*100+ (Number(n)>=0?1e-9:-1e-9))/100;
const fmtBs=v=>"Bs. "+Number(v||0).toLocaleString("es-VE",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtTasa=v=>Number(v).toLocaleString("es-VE",{minimumFractionDigits:2,maximumFractionDigits:4});
const fmtUSD=fmt;
const fechaCorta=s=>{if(!s)return"";const [y,m,d]=s.split("-");return d+"/"+m+"/"+y;};
const hoyLocal=()=>todayStr();
const diasEntre=(a,b)=>Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000);

function parseTasa(s){
  s=String(s||"").trim().replace(/[^0-9.,]/g,"");
  if(!s) return 0;
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
  return parseFloat(s)||0;
}

  tasas={};

// Tasa vigente en una fecha: la de ese día o, si no hay (fin de semana/feriado), la última anterior (máx. 10 días)
function tasaDe(fecha){
  if(!fecha) return null;
  if(tasas[fecha]>0) return {valor:tasas[fecha],fecha,exacta:true};
  let mejor=null;
  for(const k in tasas){if(k<fecha&&tasas[k]>0&&(!mejor||k>mejor))mejor=k;}
  if(mejor&&diasEntre(mejor,fecha)<=10) return {valor:tasas[mejor],fecha:mejor,exacta:false};
  return null;
}
const tasaHoyValor=()=>{const t=tasaDe(todayStr());return t&&t.exacta?t.valor:0;};
const tasaHoy=()=>tasaHoyValor()>0;
const aBs=usd=>r2((usd||0)*tasaHoyValor());
const dual=usd=>tasaHoy()?`${fmt(usd)} (${fmtBs(aBs(usd))})`:fmt(usd);

async function guardarTasaDia(fecha,valor){
  tasas[fecha]=valor;
  try{
    await db.collection("config").doc("tasasBCV").set({tasas:{[fecha]:valor},actualizado:todayStr()},{merge:true});
    return true;
  }catch(e){
    try{const l=JSON.parse(localStorage.getItem("tasasBCV_local")||"{}");l[fecha]=valor;localStorage.setItem("tasasBCV_local",JSON.stringify(l));}catch(_){}
    alert("No se pudo guardar la tasa en la nube ("+e.message+"). Quedó guardada solo en este equipo.");
    return false;
  }
}

// Bs. reales de un registro: lo guardado; si es un registro antiguo, con la tasa de su fecha (marcado como estimado)
function bsDe(rec,usd){
  const u=usd!=null?usd:((rec.total!=null?rec.total:rec.monto)||0);
  const g=rec.montoBs!=null?rec.montoBs:rec.totalBs;
  if(g!=null&&rec.tasa>0) return {bs:g,tasa:rec.tasa,fecha:rec.fecha,estimada:false};
  const t=tasaDe(rec.fecha);
  if(t) return {bs:r2(u*t.valor),tasa:t.valor,fecha:t.fecha,estimada:true};
  return {bs:null,tasa:null,fecha:null,estimada:true};
}

// Suma un conjunto [{usd,rec}] en $ y en Bs.; cuenta los que no tienen tasa ni de su fecha
function totalesDual(items){
  let usd=0,bs=0,sinTasa=0,estim=0;
  items.forEach(({usd:u,rec})=>{usd+=u;const b=bsDe(rec,u);if(b.bs==null)sinTasa++;else{bs+=b.bs;if(b.estimada)estim++;}});
  return {usd:r2(usd),bs:r2(bs),sinTasa,estim};
}

// Totales por método de pago: $ de referencia y, en los métodos en bolívares, los Bs. reales (a la tasa de cada pago)
const METODOS=[["Dólares Efectivo","💵 $ Efectivo",false],["Transferencia Bs","📲 Transf Bs",true],["Bs Efectivo","💵 Bs Efectivo",true],["Punto","💳 Punto",true]];
function totalesMetodo(lista){
  const r={};
  METODOS.forEach(([m,,enBs])=>{
    const t=totalesDual(lista.filter(p=>p.metodo===m).map(p=>({usd:p.total||0,rec:p})));
    r[m]={usd:t.usd,bs:enBs?t.bs:null,sinTasa:enBs?t.sinTasa:0,estim:enBs?t.estim:0};
  });
  return r;
}

// ==================== MORA AUTOMÁTICA (cuotas mensuales) ====================
// config/cobranza = {primerMes:"YYYY-MM", cuotas:N, diaVence:D}. Cada mes se genera la cuota de cada estudiante (= su mensualidad).
// Una cuota se considera vencida pasado el día D. Los pagos con concepto "Mensualidad" se aplican desde la cuota más antigua.
// La deuda manual anterior (estado "mora" + monto) se mantiene aparte y se suma.
let cobCfg=null;
async function cargarCobCfg(){
  cobCfg=null;
  try{
    const s=await db.collection("config").doc("cobranza").get();
    if(s.exists){
      const d=s.data();
      if(/^\d{4}-\d{2}$/.test(d.primerMes||"")&&d.cuotas>0) cobCfg={primerMes:d.primerMes,cuotas:Math.min(24,Number(d.cuotas)),diaVence:Math.min(28,Math.max(1,Number(d.diaVence)||5))};
    }
  }catch(e){console.warn("cobranza cfg:",e.message);}
}
const cobCfgActiva=()=>!!cobCfg&&!soloLectura();
function sumarMeses(ym,k){const [y,m]=ym.split("-").map(Number);const d=new Date(y,m-1+k,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
const nombreMesYM=ym=>MESES[Number(ym.split("-")[1])-1]+" "+ym.split("-")[0];

// Índice de pagos por estudiante (id, cédula, nombre) para no recorrer todos los pagos por cada estudiante
let _pagoIdx={ref:null,n:-1};
function idxPagos(){
  if(_pagoIdx.ref===pagos&&_pagoIdx.n===pagos.length) return _pagoIdx;
  const I={ref:pagos,n:pagos.length,porId:new Map(),porCed:new Map(),porNom:new Map()};
  const put=(m,k,p)=>{if(!k)return;let a=m.get(k);if(!a){a=[];m.set(k,a);}a.push(p);};
  pagos.forEach(p=>{put(I.porId,p.estId,p);put(I.porCed,p.cedula,p);put(I.porNom,(p.nombre||"").toLowerCase(),p);});
  return (_pagoIdx=I);
}
function pagosDeEstudiante(e){
  const I=idxPagos(),set=new Set();
  [I.porId.get(e.id),e.cedula?I.porCed.get(e.cedula):null,I.porNom.get((e.nombre||"").toLowerCase())].forEach(a=>{if(a)a.forEach(p=>set.add(p));});
  return [...set];
}

function calcCuotas(e,hoy){
  hoy=hoy||todayStr();
  if(!cobCfgActiva()||!activo(e)) return null;
  const m=Number(e.mensualidad)||0;
  const lista=[];
  for(let k=0;k<cobCfg.cuotas;k++){
    const ym=sumarMeses(cobCfg.primerMes,k);
    if(e.cuotaDesde&&ym<e.cuotaDesde) continue;
    lista.push({ym,mes:nombreMesYM(ym),vence:ym+"-"+String(cobCfg.diaVence).padStart(2,"0"),monto:m});
  }
  const desde=cobCfg.primerMes+"-01";
  const pagado=r2(pagosDeEstudiante(e).filter(p=>p.concepto==="Mensualidad"&&p.fecha&&p.fecha>=desde).reduce((s,p)=>s+(p.total||0),0));
  let resto=pagado;
  lista.forEach(c=>{const ab=Math.min(c.monto,Math.max(0,resto));c.pagado=r2(ab);c.pendiente=r2(c.monto-ab);resto=r2(resto-ab);c.vencida=c.vence<hoy;});
  const vencidas=lista.filter(c=>c.vencida);
  return {lista,pagado,saldo:r2(vencidas.reduce((s,c)=>s+c.pendiente,0)),
    pendientes:vencidas.filter(c=>c.pendiente>0.004),aFavor:r2(Math.max(0,resto)),
    proxima:lista.find(c=>!c.vencida&&c.pendiente>0.004)||null};
}
const deudaManual=e=>e.estado==="mora"?(e.moraMonto||0):0;
function deudaDe(e){const c=calcCuotas(e);return r2((c?c.saldo:0)+deudaManual(e));}
const enMora=e=>e.estado!=="retirado"&&(deudaDe(e)>0||e.estado==="mora");
function conceptoDeE(e){
  const c=calcCuotas(e),p=[];
  if(c&&c.pendientes.length) p.push("Mensualidad: "+c.pendientes.map(q=>q.mes).join(", "));
  if(deudaManual(e)>0||(e.estado==="mora"&&e.moraConcepto)) p.push(e.moraConcepto||"Deuda anterior");
  return p.join(" · ");
}

  </div>`;
}

// ==================== RECORDATORIOS / COBRANZA ====================
let cobF={busq:"",grado:"",orden:"monto",dias:30,vista:"mora"};
let _cobTimer=null;
const activo=e=>e.estado!=="retirado"&&!e.graduado;   // inscrito este año (ni retirado ni graduado)
const baseAnio=()=>(escCfg&&!soloLectura())?escCfg.actual.inicio:"";

// Días desde una fecha "YYYY-MM-DD" (hora local, sin desfase por UTC)
function diasDesde(fechaStr){
  if(!fechaStr) return null;
  const f=new Date(fechaStr+"T00:00:00"); if(isNaN(f)) return null;
  const h=new Date(); h.setHours(0,0,0,0);
  return Math.round((h-f)/86400000);
}

// ---- Teléfonos de Venezuela para WhatsApp
// Acepta 0412-1234567, +58 412 123 4567, 58 0412 1234567, 0058 412..., 4121234567. Devuelve 58 + 10 dígitos, o "" si no es válido.
function normalizarTelVE(t){
  let d=String(t||"").replace(/\D/g,"");
  if(!d) return "";
  d=d.replace(/^00/,"");
  d=d.startsWith("58")?"58"+d.slice(2).replace(/^0+/,""):"58"+d.replace(/^0+/,"");
  return /^58[24]\d{9}$/.test(d)?d:"";
}
const fmtTelVE=wa=>wa?"+58 "+wa.slice(2,5)+" "+wa.slice(5,8)+" "+wa.slice(8):"";
// Teléfono del representante: el primero válido entre el del acudiente y el del estudiante
function telDe(e){
  const c=[e.telefonoAcudiente,e.telefono];
  for(const x of c){const wa=normalizarTelVE(x);if(wa)return {raw:x,wa,fijo:wa[2]==="2"};}
  return {raw:c.find(Boolean)||"",wa:"",fijo:false};
}

function filaCobranza(e){
  const pagosEst=pagosDeEstudiante(e);
  const ultimo=pagosEst.length?pagosEst.reduce((a,b)=>(a.fecha||"")>(b.fecha||"")?a:b):null;
  const cu=calcCuotas(e);
  const auto=cu?cu.saldo:0, manual=deudaManual(e);
  const deuda=r2(auto+manual);
  return {e,enMora:e.estado!=="retirado"&&(deuda>0||e.estado==="mora"),deuda,auto,manual,
    meses:cu?cu.pendientes.map(q=>q.mes):[],ultimo,
    diasSin:ultimo?diasDesde(ultimo.fecha):(baseAnio()?diasDesde(baseAnio()):null),
    diasRec:e.ultimoRecordatorio?diasDesde(e.ultimoRecordatorio):null,
    nRec:e.totalRecordatorios||0,
    tel:telDe(e).raw,telWa:telDe(e).wa,telFijo:telDe(e).fijo};
}

// Con deuda (cuotas vencidas o deuda manual) + quienes llevan N días sin pagar
function listaCobranza(){
  const lim=Number(cobF.dias)||30;
  return estudiantes.filter(e=>e.estado!=="retirado").map(filaCobranza)
    .filter(r=>r.enMora||(activo(r.e)&&(r.diasSin!==null?r.diasSin>=lim:true)));
}

function cobFiltradas(todos){
  const q=(cobF.busq||"").toLowerCase();
  const big=1e9;
  const orden={
    monto:(a,b)=>b.deuda-a.deuda,
    dias:(a,b)=>(b.diasSin??big)-(a.diasSin??big),
    norec:(a,b)=>(b.diasRec??big)-(a.diasRec??big),
    nombre:(a,b)=>(a.e.nombre||"").localeCompare(b.e.nombre||"")
  }[cobF.orden]||((a,b)=>b.deuda-a.deuda);
  return todos.filter(r=>{
    if(cobF.vista==="mora"&&!r.enMora) return false;
    if(cobF.vista==="sinpago"&&r.enMora) return false;
    if(cobF.grado&&r.e.grado!==cobF.grado) return false;
    if(q&&!((r.e.nombre||"").toLowerCase().includes(q)||(r.e.cedula||"").includes(q)||(r.e.acudiente||"").toLowerCase().includes(q))) return false;
    return true;
  }).sort(orden);
}

// ---- Recibo de cobranza (imagen) y envío por WhatsApp
function modeloReciboCobranza(r){
  const e=r.e, tv=tasaDe(todayStr()), conTasa=!!(tv&&tv.exacta);
  const filas=[];
  const cu=calcCuotas(e);
  if(cu) cu.pendientes.forEach(q=>filas.push({desc:"Mensualidad "+q.mes,sub:"Venció el "+fechaCorta(q.vence)+(q.pagado>0?" · abonado "+fmt(q.pagado):""),usd:q.pendiente}));
  if(deudaManual(e)>0) filas.push({desc:e.moraConcepto||"Deuda anterior",sub:"Saldo anterior",usd:deudaManual(e)});
  if(!filas.length&&r.enMora) filas.push({desc:e.moraConcepto||"Pagos pendientes",sub:"",usd:0});
  if(!filas.length) filas.push({desc:"Mensualidad",sub:r.ultimo?"Último pago: "+fechaCorta(r.ultimo.fecha):"Sin pagos registrados",usd:e.mensualidad||0});
  const totalUsd=r2(filas.reduce((s,f)=>s+f.usd,0));
  filas.forEach(f=>{f.bs=conTasa?r2(f.usd*tv.valor):null;});
  return {empresa:EMPRESA,sub:EMPRESA_SUB,numero:"COB-"+todayStr().replace(/-/g,"").slice(2)+"-"+String(e.cedula||e.id).slice(-4),
    fecha:fechaCorta(todayStr()),estudiante:e.nombre||"",grado:e.grado||"",representante:e.acudiente||"",cedula:e.cedula||"",
    filas,totalUsd,tasa:conTasa?tv:null,totalBs:conTasa?r2(totalUsd*tv.valor):null};
}

function lineasTexto(ctx,txt,maxW){
  const pal=String(txt||"").split(/\s+/).filter(Boolean),out=[];let cur="";
  pal.forEach(p=>{const t=cur?cur+" "+p:p;if(ctx.measureText(t).width>maxW&&cur){out.push(cur);cur=p;}else cur=t;});
  if(cur) out.push(cur);
  return out.length?out:[""];
}

// Dibuja el recibo. Con dibujar=false solo mide y devuelve el alto necesario.
function pintarRecibo(ctx,m,W,dibujar){
  const P=40,AZUL="#003366",ORO="#ffd700";
  const F=f=>{ctx.font=f;};
  const T=(txt,x,y,f,c,al)=>{F(f);if(!dibujar)return;ctx.fillStyle=c;ctx.textAlign=al||"left";ctx.fillText(txt,x,y);};
  const R=(x,y,w,h,c)=>{if(!dibujar)return;ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};
  R(0,0,W,W*12,"#ffffff");
  R(0,0,W,135,AZUL);
  T(m.empresa,W/2,56,"bold 30px Georgia",ORO,"center");
  T(m.sub,W/2,86,"17px Arial","#adc8ff","center");
  T("RECIBO DE COBRANZA",W/2,118,"bold 19px Arial","#ffffff","center");
  let y=169;
  T("N° "+m.numero,P,y,"bold 16px Arial",AZUL);T("Fecha: "+m.fecha,W-P,y,"16px Arial","#555","right");
  y+=14;R(P,y,W-2*P,2,"#e1e8f5");y+=30;
  const dato=(et,val)=>{
    T(et,P,y,"bold 15px Arial","#888");
    F("17px Arial");const L=lineasTexto(ctx,val,W-2*P-170);
    L.forEach((l,i)=>T(l,P+170,y+i*22,"17px Arial","#222"));
    y+=L.length*22+8;
  };
  dato("Estudiante",m.estudiante);
  if(m.grado) dato("Grado",m.grado);
  if(m.representante) dato("Representante",m.representante);
  if(m.cedula) dato("Cédula",m.cedula);
  y+=10;
  const xUsd=m.tasa?W-P-200:W-P-14, xBs=W-P-14;
  R(P,y,W-2*P,40,"#eef3fb");
  T("DETALLE",P+14,y+26,"bold 15px Arial",AZUL);
  T("REFERENCIA ($)",xUsd,y+26,"bold 15px Arial",AZUL,"right");
  if(m.tasa) T("BOLÍVARES (Bs.)",xBs,y+26,"bold 15px Arial",AZUL,"right");
  y+=40;
  m.filas.forEach(f=>{
    const maxW=xUsd-130-(P+14);
    F("bold 18px Arial");const d=lineasTexto(ctx,f.desc,maxW);
    F("14px Arial");const s=f.sub?lineasTexto(ctx,f.sub,maxW):[];
    const h=Math.max(58,16+d.length*24+s.length*20+14);
    d.forEach((l,i)=>T(l,P+14,y+30+i*24,"bold 18px Arial","#222"));
    s.forEach((l,i)=>T(l,P+14,y+30+d.length*24+i*20-2,"14px Arial","#888"));
    T(fmt(f.usd),xUsd,y+32,"bold 18px Arial","#222","right");
    if(m.tasa&&f.bs!=null) T(fmtBs(f.bs),xBs,y+32,"18px Arial","#222","right");
    R(P,y+h-1,W-2*P,1,"#e8ecf4");y+=h;
  });
  y+=22;
  const alto=m.tasa?150:96;
  R(P,y,W-2*P,alto,AZUL);
  T("TOTAL REFERENCIA (USD)",P+20,y+38,"bold 15px Arial",ORO);T(fmt(m.totalUsd),W-P-20,y+40,"bold 26px Georgia",ORO,"right");
  if(m.tasa){
    T("Tasa BCV del "+fechaCorta(m.tasa.fecha),P+20,y+72,"15px Arial","#adc8ff");T("Bs. "+fmtTasa(m.tasa.valor)+" por $1",W-P-20,y+72,"15px Arial","#ffffff","right");
    T("TOTAL EN BOLÍVARES",P+20,y+116,"bold 15px Arial",ORO);T(fmtBs(m.totalBs),W-P-20,y+120,"bold 30px Georgia","#ffffff","right");
  } else T("Pagadero en bolívares a la tasa BCV del día del pago",P+20,y+74,"14px Arial","#adc8ff");
  y+=alto+26;
  F("14px Arial");
  lineasTexto(ctx,"El pago se recibe en bolívares a la tasa oficial BCV del día del pago. Si ya realizó el pago, por favor envíe el comprobante por este medio.",W-2*P).forEach(l=>{T(l,P,y,"14px Arial","#666");y+=20;});
  T("¡Gracias por su atención!",W/2,y+22,"bold 16px Arial",AZUL,"center");
  return y+60;
}

async function reciboCobranzaBlob(r){
  const m=modeloReciboCobranza(r),W=900,S=1.5;
  const medir=document.createElement("canvas").getContext("2d");
  if(!medir) throw new Error("este navegador no puede dibujar el recibo");
  const H=Math.ceil(pintarRecibo(medir,m,W,false));
  const cv=document.createElement("canvas");cv.width=Math.round(W*S);cv.height=Math.round(H*S);
  const ctx=cv.getContext("2d");ctx.scale(S,S);
  pintarRecibo(ctx,m,W,true);
  const blob=await new Promise(res=>cv.toBlob(res,"image/png"));
  if(!blob) throw new Error("no se pudo crear la imagen");
  return blob;
}

function captionCobro(r){
  const tv=tasaDe(todayStr()),con=!!(tv&&tv.exacta);
  const tot=r.enMora?r.deuda:(r.e.mensualidad||0);
  return `🏫 *${EMPRESA}*\nRecibo de cobranza — *${r.e.nombre}*\n${r.enMora?"Saldo pendiente":"Mensualidad"}: *${fmt(tot)}*${con?" (*"+fmtBs(r2(tot*tv.valor))+"* a tasa BCV del "+fechaCorta(tv.fecha)+")":""}\nSi ya realizó el pago, envíenos el comprobante. ¡Gracias!`;
}

function descargarBlob(blob,nombre){
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nombre;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}

// Un toque: genera el recibo como imagen y lo manda a WhatsApp.
// Celular: abre la hoja de compartir con la imagen lista (se elige el chat). Computadora: copia la imagen y abre el chat (Ctrl+V).
async function enviarReciboCobranza(estId){
  const e=estudiantes.find(x=>x.id===estId); if(!e) return;
  const r=filaCobranza(e);
  let blob;
  try{blob=await reciboCobranzaBlob(r);}
  catch(err){alert("No se pudo generar el recibo ("+err.message+"). Usa «Solo texto».");return;}
  const nombre="recibo-cobranza-"+(e.nombre||"estudiante").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase()+".png";
  const file=new File([blob],nombre,{type:"image/png"});
  const caption=captionCobro(r);
  if(!tasaHoy()&&!confirm("No has cargado la tasa BCV de hoy: el recibo saldrá solo con el monto en $ (pagadero en Bs. a la tasa del día).\n\n¿Continuar?")) return;
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],text:caption});await marcarRecordado(estId);return;}
    catch(err){if(err&&err.name==="AbortError")return;}   // si falla por otra razón, sigue con el plan B
  }
  let copiado=false;
  try{if(navigator.clipboard&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);copiado=true;}}catch(_){}
  if(!copiado) descargarBlob(blob,nombre);
  if(!r.telWa){
    alert((copiado?"El recibo quedó copiado.":"El recibo se descargó.")+"\n\n"+(r.tel?"El número «"+r.tel+"» no es válido para WhatsApp.":"Este estudiante no tiene teléfono.")+" Corrígelo con ✏️ o pega el recibo manualmente en el chat.");
    return;
  }
  window.open("https://wa.me/"+r.telWa+"?text="+encodeURIComponent(caption),"_blank");
  alert(copiado?"✅ El recibo quedó copiado. En el chat de WhatsApp pega la imagen (Ctrl+V) y envía.":"El recibo se descargó. En el chat de WhatsApp adjúntalo con el clip 📎 y envía.");
  await marcarRecordado(estId);
}

async function enviarCorreoCobranza(estId){
  let e=estudiantes.find(x=>x.id===estId); if(!e) return;
  if(!correoValido(e.correoAcudiente)){
    if(!await corregirCorreo(estId)) return;
    e=estudiantes.find(x=>x.id===estId);
  }
  const r=filaCobranza(e),to=e.correoAcudiente.trim().toLowerCase();
  if(!tasaHoy()&&!confirm("No has cargado la tasa BCV de hoy: el recibo saldrá solo con el monto en $ (pagadero en Bs. a la tasa del día).\n\n¿Continuar?")) return;
  if(!correoCfg){
    if(!confirm("Aún no está configurada la plantilla de correo (el director lo hace en Cobranza → ✉️ Correo).\n\nMientras tanto puedo abrir tu programa de correo con el mensaje listo para "+to+". ¿Abrirlo?")) return;
    window.open("mailto:"+to+"?subject="+encodeURIComponent("Recibo de cobranza — "+e.nombre+" — "+EMPRESA)+"&body="+encodeURIComponent(textoReciboCobranza(modeloReciboCobranza(r))),"_self");
    await marcarRecordado(estId);
    return;
  }
  if(!confirm("Se enviará el recibo de cobranza de "+e.nombre+" a:\n"+to+"\n\n¿Continuar?")) return;
  const res=await enviarCorreoCobranzaCore(r);
  if(res.ok){await marcarRecordado(estId);mostrarToast("✅ Recibo enviado a "+res.to);}
  else alert("No se pudo enviar el correo: "+res.error);
}

function cobrarWhatsApp(estId){
  const e=estudiantes.find(x=>x.id===estId); if(!e) return;

  if(!r.telWa){alert(r.tel?"El número «"+r.tel+"» no es válido para WhatsApp. Corrígelo con ✏️.":"Este estudiante no tiene teléfono registrado");return;}
  if(!tasaHoy()&&!confirm("No has cargado la tasa BCV de hoy. El mensaje saldrá solo con el monto en $ (pagadero en Bs. a la tasa BCV del día).\n\n¿Continuar?")) return;
  window.open("https://wa.me/"+r.telWa+"?text="+encodeURIComponent(mensajeCobro(r)),"_blank");
  marcarRecordado(estId);
}

async function corregirTelefono(estId){
  const e=estudiantes.find(x=>x.id===estId); if(!e) return;
  const v=prompt("Teléfono (WhatsApp) del representante de "+e.nombre+".\nEjemplo: 0412-1234567",e.telefonoAcudiente||e.telefono||"");
  if(v===null) return;
  const wa=normalizarTelVE(v);
  if(!wa){alert("Número inválido. Debe llevar el código de operadora y 7 dígitos, por ejemplo 0412-1234567");return;}
  if(wa[2]==="2"&&!confirm("Ese parece un teléfono FIJO: WhatsApp normalmente no lo encuentra.\n\n¿Guardarlo de todos modos?")) return;
  const nuevo="0"+wa.slice(2,5)+"-"+wa.slice(5);
  try{await db.collection("estudiantes").doc(estId).update({telefonoAcudiente:nuevo});}
  catch(err){alert("No se pudo guardar: "+err.message);return;}
  const i=estudiantes.findIndex(x=>x.id===estId);
  estudiantes[i]={...estudiantes[i],telefonoAcudiente:nuevo};
  renderTabContent();
}

function imprimirBoletinPrimaria(est){
  const estId = est.id;
  const inst = configInst||{};
  const esPreescolar = getNivel(est.grado)==="preescolar";
  const areas = esPreescolar ? AREAS_MATERNAL : AREAS_PRIMARIA;

  const LETRAS_LEGEND = [
    ["A","El alumno alcanzó todas las competencias y en algunos casos superó las expectativas previstas para el grado."],
    ["B","El alumno alcanzó todas las competencias previstas para el grado."],
    ["C","El alumno alcanzó la mayoría de las competencias previstas para el grado."],
    ["D","El alumno alcanzó algunas de las competencias previstas para el grado, pero requiere de un proceso de nivelación."],
    ["E","El alumno no logró adquirir las competencias mínimas requeridas para ser promovido al grado superior inmediato."],
  ];

  // Count total asistencia e inasistencia
  let totalAsist = 0, totalInasist = 0;
  LAPSOS.forEach(lapso=>{
    const k=`${estId}_${lapso}`;
    const nd = notas[k]||{};
    totalAsist += parseInt(nd._asistencia||0);
    totalInasist += parseInt(nd._inasistencia||0);
  });

  // Build rows for each lapso
  const buildRowsPrimaria = (lapso) => {
    const k=`${estId}_${lapso}`;
    const nd=notas[k]||{};
    return areas.map(area=>{
      const inds = getIndicadores(est.grado, area);
      if(!inds||inds.length===0){
        return `<tr>
          <td style="writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-weight:700;font-size:0.7rem;padding:4px;border:1px solid #ccc;background:#f0f4ff;color:#003366" rowspan="1">${area}</td>
          <td style="padding:5px 8px;border:1px solid #ccc;font-size:0.75rem;color:#aaa" colspan="6">Sin indicadores configurados</td>
        </tr>`;
      }
      return inds.map((ind,i)=>{
        const fieldKey = area+"_ind_"+i;
        const val = nd[fieldKey]||"";
        return `<tr>
          `+(i===0?'<td style="writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-weight:700;font-size:0.7rem;padding:4px;border:1px solid #ccc;background:#f0f4ff;color:#003366" rowspan="'+inds.length+'">'+area+'</td>':"")+`
          <td style="padding:4px 8px;border:1px solid #ccc;font-size:0.75rem">${ind}</td>
          ${["A","B","C","D","E"].map(l=>`<td style="text-align:center;border:1px solid #ccc;padding:3px;font-weight:700;color:${val===l?"#003366":"#ccc"}">${val===l?"✓":""}</td>`).join("")}
        </tr>`;
      }).join("");
    }).join("");
  };

  // Determine if promovido
  const tieneE = areas.some(area=>{
    const inds = getIndicadores(est.grado,area)||[];
    return inds.some((_,i)=>{
      const fieldKey=area+"_ind_"+i;
      return LAPSOS.some(lapso=>(notas[`${estId}_${lapso}`]||{})[fieldKey]==="E");
    });
  });

  const w = window.open("","_blank");
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">

  <style>

    .dato{display:flex;gap:4px;font-size:0.72rem}
    .dato label{font-weight:700;color:#003366;min-width:90px}
    .lapso-title{background:#003366;color:#fff;padding:5px 10px;font-size:0.78rem;font-weight:700;border-radius:4px;margin:8px 0 4px}
    table{width:100%;border-collapse:collapse;margin-bottom:6px}
    thead th{background:#003366;color:#fff;padding:4px;text-align:center;border:1px solid #002244;font-size:0.7rem}

    @media print{button{display:none!important}.page-break{page-break-before:always}}
  </style></head><body>
  <button onclick="window.print()" style="margin-bottom:10px;padding:6px 14px;background:#003366;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:0.8rem">🖨️ Imprimir</button>

  <div class="header">

  ${LAPSOS.map((lapso,li)=>`

  <div style="margin-top:10px">

// ==================== INICIALIZADOR DE SESIÓN ====================
// Este código "despierta" el sistema y verifica si alguien ya inició sesión
fbAuth.onAuthStateChanged(async (user) => {
  if (user) {
    // Si hay un usuario logueado, verificamos su rol
    const staticRole = ROLES[user.email];
    if (staticRole) {
      rolUsuario = staticRole;
      auth = true;
      cargarTodo(); // Carga la plataforma
    } else {
      // Verificar si es un docente guardado en la base de datos
      try {
        const userDoc = await db.collection("usuarios").doc(user.uid).get();
        if (userDoc.exists && userDoc.data().rol === "docente" && userDoc.data().activo !== false) {
          rolUsuario = "docente";
          usuarioActual = { ...userDoc.data(), uid: user.uid };
          auth = true;
          cargarTodo(); // Carga la plataforma
        } else {
          fbAuth.signOut();
          auth = false;
          render(); // Muestra el login
        }
      } catch (e) {
        console.error("Error verificando usuario:", e);
        fbAuth.signOut();
        auth = false;
        render(); // Muestra el login
      }
    }
  } else {
    // Si no hay nadie logueado, mostramos la pantalla de Login directamente
    auth = false;
    render(); 
  }
});
